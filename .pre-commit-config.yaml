fail_fast: true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3  # Keep in sync with the dev extra in pyproject.toml.
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-toml

  - repo: local
    hooks:
      - id: lint-imports
        name: lint-imports
        entry: .venv/bin/lint-imports
        language: system
        files: '(\.py$|^\.importlinter$)'
        pass_filenames: false
      - id: check-architecture
        name: check-architecture
        entry: .venv/bin/python scripts/check_architecture.py
        language: system
        files: '^(marivo/.*\.py|scripts/(check_architecture\.py|architecture_baseline\.json)|\.importlinter|pyproject\.toml)$'
        pass_filenames: false
      - id: typecheck
        name: typecheck (mypy marivo and tests)
        entry: make typecheck
        language: system
        types: [python]
        files: ^(marivo|tests)/
        pass_filenames: false
