<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">The Marivo semantic layer turns business meaning into an executable contract for agents</title>
  <desc id="desc">Business owners confirm meaning, datasources provide physical evidence, and the Python semantic layer manages business objects through Git, verify, preview, and readiness before handing stable refs to agents and analysis.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ee"/>
      <stop offset="1" stop-color="#edf5f0"/>
    </linearGradient>
    <linearGradient id="contract" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123e33"/>
      <stop offset="1" stop-color="#0b2b24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0d4639" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b9f80"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#147d64" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
      .eyebrow { fill: #147d64; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .heading { fill: #132a22; font-size: 32px; font-weight: 700; }
      .section { fill: #15372d; font-size: 20px; font-weight: 700; }
      .label { fill: #29473d; font-size: 16px; font-weight: 650; }
      .muted { fill: #6a7e76; font-size: 14px; }
      .tiny { fill: #789087; font-size: 12px; }
      .white { fill: #f2fff9; }
      .mint { fill: #b9f4dd; }
    </style>
  </defs>

  <rect width="1400" height="820" rx="30" fill="url(#paper)"/>
  <rect width="1400" height="820" rx="30" fill="url(#grid)"/>

  <text x="70" y="70" class="eyebrow mono">MARIVO / SEMANTIC LAYER</text>
  <text x="70" y="116" class="heading">Turning business meaning into an executable contract for agents</text>

  <rect x="402" y="148" width="596" height="64" rx="18" fill="#e0f6ec" stroke="#42b892" stroke-opacity=".45"/>
  <circle cx="438" cy="180" r="14" fill="#147d64"/>
  <path d="M432 180l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="465" y="176" class="label">Business owners confirm meaning and boundaries</text>
  <text x="465" y="196" class="tiny">Technical checks cannot replace business approval</text>
  <path d="M700 212 V244" fill="none" stroke="#2b9f80" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="60" y="264" width="276" height="332" rx="24" fill="#fffdf8" stroke="#1d6d59" stroke-opacity=".22"/>
  </g>
  <text x="86" y="301" class="eyebrow mono">PHYSICAL EVIDENCE</text>
  <text x="86" y="337" class="section">Where facts come from</text>

  <rect x="86" y="367" width="224" height="58" rx="14" fill="#edf5f0"/>
  <text x="104" y="390" class="label">datasource</text>
  <text x="104" y="411" class="tiny">Connection and credential refs</text>

  <rect x="86" y="439" width="224" height="58" rx="14" fill="#edf5f0"/>
  <text x="104" y="462" class="label">physical source</text>
  <text x="104" y="483" class="tiny">Tables, columns, types, partitions</text>

  <rect x="86" y="511" width="224" height="58" rx="14" fill="#dff4ea"/>
  <text x="104" y="534" class="label">bounded snapshot</text>
  <text x="104" y="555" class="tiny">Evidence within an explicit scope</text>

  <path d="M336 430 H392" fill="none" stroke="#2b9f80" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="347" y="416" class="tiny mono">inspect</text>

  <g filter="url(#shadow)">
    <rect x="402" y="244" width="596" height="372" rx="28" fill="url(#contract)"/>
  </g>
  <text x="434" y="286" class="eyebrow mono mint">PYTHON / SOURCE OF TRUTH</text>
  <text x="434" y="326" class="section white">Semantic contract</text>
  <text x="434" y="351" class="muted" fill="#a9c9bd">Stable identity, business meaning, computation, and usage limits</text>

  <rect x="434" y="378" width="250" height="86" rx="17" fill="#164d40" stroke="#77d8ba" stroke-opacity=".28"/>
  <text x="454" y="407" class="label white">Domain / Entity</text>
  <text x="454" y="431" class="tiny" fill="#b9d9ce">Ownership · grain · key · source</text>
  <text x="454" y="450" class="tiny" fill="#b9d9ce">Defines what we are analyzing</text>

  <rect x="716" y="378" width="250" height="86" rx="17" fill="#164d40" stroke="#77d8ba" stroke-opacity=".28"/>
  <text x="736" y="407" class="label white">Dimension / Time</text>
  <text x="736" y="431" class="tiny" fill="#b9d9ce">Business slices · timeline · timezone</text>
  <text x="736" y="450" class="tiny" fill="#b9d9ce">Defines grouping and alignment</text>

  <rect x="434" y="480" width="250" height="86" rx="17" fill="#164d40" stroke="#77d8ba" stroke-opacity=".28"/>
  <text x="454" y="509" class="label white">Measure / Metric</text>
  <text x="454" y="533" class="tiny" fill="#b9d9ce">Unit · additivity · aggregation · filters</text>
  <text x="454" y="552" class="tiny" fill="#b9d9ce">Defines what the value means</text>

  <rect x="716" y="480" width="250" height="86" rx="17" fill="#164d40" stroke="#77d8ba" stroke-opacity=".28"/>
  <text x="736" y="509" class="label white">Relationship / Context</text>
  <text x="736" y="533" class="tiny" fill="#b9d9ce">Joins · definitions · guardrails</text>
  <text x="736" y="552" class="tiny" fill="#b9d9ce">Defines valid and invalid use</text>

  <text x="434" y="596" class="tiny mono" fill="#73cdb0">typed ref · Ibis expression · fail closed</text>

  <path d="M998 430 H1054" fill="none" stroke="#2b9f80" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="1010" y="416" class="tiny mono">ref</text>

  <g filter="url(#shadow)">
    <rect x="1064" y="264" width="276" height="332" rx="24" fill="#fffdf8" stroke="#1d6d59" stroke-opacity=".22"/>
  </g>
  <text x="1090" y="301" class="eyebrow mono">AGENT / ANALYSIS</text>
  <text x="1090" y="337" class="section">Choose the next step</text>

  <rect x="1090" y="367" width="224" height="58" rx="14" fill="#edf5f0"/>
  <text x="1108" y="390" class="label">Discover governed objects</text>
  <text x="1108" y="411" class="tiny">No guessing from column names</text>

  <rect x="1090" y="439" width="224" height="58" rx="14" fill="#edf5f0"/>
  <text x="1108" y="462" class="label">Plan the investigation</text>
  <text x="1108" y="483" class="tiny">Select observe, compare …</text>

  <rect x="1090" y="511" width="224" height="58" rx="14" fill="#dff4ea"/>
  <text x="1108" y="534" class="label">Produce traceable results</text>
  <text x="1108" y="555" class="tiny">Continue in Analysis DSL and session</text>

  <text x="70" y="663" class="eyebrow mono">CHANGE CONTROL</text>
  <path d="M208 710 H1178" fill="none" stroke="#a5beb5" stroke-width="2"/>

  <g>
    <circle cx="208" cy="710" r="17" fill="#147d64"/>
    <text x="208" y="715" text-anchor="middle" class="tiny white mono">1</text>
    <text x="208" y="752" text-anchor="middle" class="label">Git review</text>
    <text x="208" y="774" text-anchor="middle" class="tiny">Meaning and downstream impact</text>
  </g>
  <g>
    <circle cx="451" cy="710" r="17" fill="#147d64"/>
    <text x="451" y="715" text-anchor="middle" class="tiny white mono">2</text>
    <text x="451" y="752" text-anchor="middle" class="label">load</text>
    <text x="451" y="774" text-anchor="middle" class="tiny">Load one Python definition</text>
  </g>
  <g>
    <circle cx="694" cy="710" r="17" fill="#147d64"/>
    <text x="694" y="715" text-anchor="middle" class="tiny white mono">3</text>
    <text x="694" y="752" text-anchor="middle" class="label">verify</text>
    <text x="694" y="774" text-anchor="middle" class="tiny">Static, query-free checks</text>
  </g>
  <g>
    <circle cx="937" cy="710" r="17" fill="#147d64"/>
    <text x="937" y="715" text-anchor="middle" class="tiny white mono">4</text>
    <text x="937" y="752" text-anchor="middle" class="label">preview</text>
    <text x="937" y="774" text-anchor="middle" class="tiny">Explicit scope, bounded reads</text>
  </g>
  <g>
    <circle cx="1178" cy="710" r="17" fill="#147d64"/>
    <text x="1178" y="715" text-anchor="middle" class="tiny white mono">5</text>
    <text x="1178" y="752" text-anchor="middle" class="label">readiness</text>
    <text x="1178" y="774" text-anchor="middle" class="tiny">Dependency closure and handoff</text>
  </g>
</svg>
