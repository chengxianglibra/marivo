<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">Marivo 总体架构</title>
  <desc id="description">Agent 通过面向 Agent 的接口进行规划与判断。Marivo 约束业务语义、类型化分析、持久的分析会话与证据，把已确认的业务含义和数据执行连接到可追溯的运营、治理与决策交接。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#f2f6f1"/>
    </linearGradient>
    <linearGradient id="agentFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ea"/>
      <stop offset="1" stop-color="#f8edda"/>
    </linearGradient>
    <linearGradient id="harnessFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8f2"/>
      <stop offset="1" stop-color="#e4f1e9"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#173b2f" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#147d64"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c67a00"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .ink { fill: #17241f; }
      .muted { fill: #64726c; }
      .green { fill: #0d5b49; }
      .amber { fill: #a96400; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .card-title { font-size: 23px; font-weight: 700; }
      .card-copy { font-size: 16px; }
    </style>
  </defs>

  <rect width="1400" height="900" rx="28" fill="url(#paper)"/>
  <path d="M0 158H1400M0 742H1400" stroke="#147d64" stroke-opacity="0.06"/>
  <circle cx="1275" cy="95" r="190" fill="#b9f4dd" opacity="0.16"/>
  <circle cx="95" cy="835" r="210" fill="#d9eadf" opacity="0.22"/>

  <text x="80" y="68" class="sans ink" font-size="31" font-weight="760">Marivo 总体架构</text>
  <text x="1320" y="66" text-anchor="end" class="sans muted" font-size="17">让智能自由探索，让约束守住事实</text>

  <g filter="url(#shadow)">
    <rect x="180" y="100" width="1040" height="142" rx="24" fill="url(#agentFill)" stroke="#d89a35" stroke-width="1.5"/>
  </g>
  <text x="215" y="132" class="mono amber eyebrow">开放智能 · 规划与判断</text>
  <rect x="215" y="157" width="235" height="56" rx="14" fill="#fffdf8" stroke="#d89a35" stroke-opacity="0.45"/>
  <text x="332.5" y="180" text-anchor="middle" class="sans ink" font-size="17" font-weight="700">业务问题</text>
  <text x="332.5" y="201" text-anchor="middle" class="sans muted" font-size="14">意图与决策背景</text>
  <path d="M466 185H562" stroke="#c67a00" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <circle cx="700" cy="185" r="46" fill="#fffdf8" stroke="#c67a00" stroke-width="2"/>
  <text x="700" y="179" text-anchor="middle" class="mono amber" font-size="21" font-weight="800">AGENT</text>
  <text x="700" y="202" text-anchor="middle" class="sans muted" font-size="13">选择调查路径</text>
  <path d="M838 185H934" stroke="#c67a00" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <rect x="950" y="157" width="235" height="56" rx="14" fill="#fffdf8" stroke="#d89a35" stroke-opacity="0.45"/>
  <text x="1067.5" y="180" text-anchor="middle" class="sans ink" font-size="17" font-weight="700">解释与综合</text>
  <text x="1067.5" y="201" text-anchor="middle" class="sans muted" font-size="14">给出判断与限制</text>

  <path d="M700 246V278" stroke="#147d64" stroke-width="2.5" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>
  <rect x="245" y="282" width="910" height="76" rx="18" fill="#0d5b49"/>
  <text x="275" y="311" class="mono" fill="#b9f4dd" font-size="14" font-weight="700" letter-spacing="2">面向 AGENT 的接口</text>
  <text x="275" y="337" class="sans" fill="#ffffff" font-size="17">实时帮助  ·  对象状态  ·  有效后续动作  ·  结构化错误</text>
  <text x="1125" y="327" text-anchor="end" class="mono" fill="#b9f4dd" font-size="14">编写 → 运行 → 读取</text>

  <g filter="url(#shadow)">
    <rect x="80" y="390" width="1240" height="330" rx="28" fill="url(#harnessFill)" stroke="#147d64" stroke-width="1.6"/>
  </g>
  <rect x="108" y="416" width="38" height="38" rx="9" fill="#0d5b49"/>
  <text x="127" y="442" text-anchor="middle" class="mono" fill="#ffffff" font-size="20" font-weight="800">M</text>
  <text x="160" y="434" class="mono green eyebrow">MARIVO 分析 HARNESS</text>
  <text x="160" y="457" class="sans muted" font-size="15">约束事实、动作、状态与证据边界</text>

  <g>
    <rect x="108" y="488" width="270" height="190" rx="20" fill="#fffefa" stroke="#82b9a5"/>
    <text x="132" y="523" class="mono green" font-size="14" font-weight="700">01 · 含义</text>
    <text x="132" y="558" class="sans ink card-title">语义层</text>
    <text x="132" y="590" class="sans muted card-copy">稳定的业务对象、</text>
    <text x="132" y="614" class="sans muted card-copy">指标、关系与</text>
    <text x="132" y="638" class="sans muted card-copy">使用约束</text>
  </g>
  <path d="M390 583H410" stroke="#147d64" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <g>
    <rect x="422" y="488" width="270" height="190" rx="20" fill="#fffefa" stroke="#82b9a5"/>
    <text x="446" y="523" class="mono green" font-size="14" font-weight="700">02 · 动作</text>
    <text x="446" y="558" class="sans ink card-title">类型化分析</text>
    <text x="446" y="590" class="sans muted card-copy">显式的分析动作、</text>
    <text x="446" y="614" class="sans muted card-copy">输入规则、结果类型</text>
    <text x="446" y="638" class="sans muted card-copy">与可信拒绝</text>
  </g>
  <path d="M704 583H724" stroke="#147d64" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <g>
    <rect x="736" y="488" width="270" height="190" rx="20" fill="#fffefa" stroke="#82b9a5"/>
    <text x="760" y="523" class="mono green" font-size="14" font-weight="700">03 · 状态</text>
    <text x="760" y="558" class="sans ink card-title">分析会话</text>
    <text x="760" y="590" class="sans muted card-copy">持久的调查状态、</text>
    <text x="760" y="614" class="sans muted card-copy">不可变分析产物与</text>
    <text x="760" y="638" class="sans muted card-copy">跨轮次来源链路</text>
  </g>
  <path d="M1018 583H1038" stroke="#147d64" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <g>
    <rect x="1050" y="488" width="242" height="190" rx="20" fill="#fff9ed" stroke="#d89a35"/>
    <text x="1074" y="523" class="mono amber" font-size="14" font-weight="700">04 · 支持</text>
    <text x="1074" y="558" class="sans ink card-title">证据</text>
    <text x="1074" y="590" class="sans muted card-copy">有界读取、</text>
    <text x="1074" y="614" class="sans muted card-copy">精确追溯与明确的</text>
    <text x="1074" y="638" class="sans muted card-copy">结论边界</text>
  </g>

  <path d="M245 720V758" stroke="#147d64" stroke-width="2.2" marker-start="url(#arrowGreen)"/>
  <path d="M700 720V758" stroke="#147d64" stroke-width="2.2" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>
  <path d="M1167 720V758" stroke="#c67a00" stroke-width="2.2" marker-end="url(#arrowAmber)"/>

  <g>
    <rect x="80" y="766" width="360" height="92" rx="18" fill="#fffefa" stroke="#82b9a5"/>
    <text x="106" y="800" class="mono green" font-size="13" font-weight="700" letter-spacing="1.3">已确认的业务含义</text>
    <text x="106" y="830" class="sans muted" font-size="15">由负责的人确认业务定义</text>
  </g>
  <g>
    <rect x="520" y="766" width="360" height="92" rx="18" fill="#fffefa" stroke="#82b9a5"/>
    <text x="546" y="800" class="mono green" font-size="13" font-weight="700" letter-spacing="1.3">数据与查询执行</text>
    <text x="546" y="830" class="sans muted" font-size="15">数据仓库、数据库与执行引擎</text>
  </g>
  <g>
    <rect x="960" y="766" width="360" height="92" rx="18" fill="#fff8ea" stroke="#d89a35"/>
    <text x="986" y="794" class="mono amber" font-size="13" font-weight="700" letter-spacing="1.3">可信交接</text>
    <text x="986" y="819" class="sans ink" font-size="15">结论  ·  证据  ·  限制</text>
    <text x="986" y="841" class="sans muted" font-size="13">用于运营、治理与决策</text>
  </g>
</svg>
