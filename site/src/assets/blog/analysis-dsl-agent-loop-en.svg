<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">The typed path and terminal escape hatches in Marivo Analysis DSL</title>
  <desc id="desc">Semantic objects pass through the Analysis DSL to produce composable typed results. Raw SQL provides a bounded diagnostic when a semantic definition is missing, while to_pandas opens the Python ecosystem from an established typed result. Neither terminal output can re-enter typed analysis, and every escape provides feedback for improving the semantic layer or DSL.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ed"/>
      <stop offset="1" stop-color="#eaf4ef"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123f34"/>
      <stop offset="1" stop-color="#092a23"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#147d64" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0d4639" flood-opacity=".11"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#239878"/>
    </marker>
    <marker id="escape-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#cc7655"/>
    </marker>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
      .eyebrow { fill: #147d64; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .heading { fill: #102a21; font-size: 34px; font-weight: 700; }
      .section { fill: #15372d; font-size: 22px; font-weight: 700; }
      .label { fill: #29473d; font-size: 16px; font-weight: 650; }
      .body { fill: #526b62; font-size: 14px; }
      .tiny { fill: #71877e; font-size: 12px; }
      .white { fill: #f3fff9; }
      .mint { fill: #b9f4dd; }
      .warm { fill: #a94f31; }
    </style>
  </defs>

  <rect width="1400" height="840" rx="30" fill="url(#paper)"/>
  <rect width="1400" height="840" rx="30" fill="url(#grid)"/>

  <text x="70" y="68" class="eyebrow mono">MARIVO / ANALYSIS DSL</text>
  <text x="70" y="114" class="heading">Typed analysis is the primary path. Escape hatches keep the boundary honest.</text>

  <text x="70" y="162" class="eyebrow mono">PRIMARY PATH</text>

  <g filter="url(#shadow)">
    <rect x="70" y="188" width="300" height="212" rx="24" fill="#fffdf8" stroke="#1d6d59" stroke-opacity=".25"/>
  </g>
  <text x="98" y="226" class="eyebrow mono">SEMANTIC LAYER</text>
  <text x="98" y="264" class="section">Approved business objects</text>
  <text x="98" y="302" class="body mono">metric · dimension</text>
  <text x="98" y="329" class="body mono">Event · StateModel</text>
  <rect x="98" y="352" width="244" height="28" rx="9" fill="#e4f3ec"/>
  <text x="220" y="371" text-anchor="middle" class="tiny">Explicit identity, scope, and rules</text>

  <path d="M370 294H430" fill="none" stroke="#239878" stroke-width="2.4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="430" y="164" width="500" height="260" rx="28" fill="url(#dark)"/>
  </g>
  <text x="462" y="206" class="eyebrow mono mint">ANALYSIS DSL</text>
  <text x="462" y="248" class="section white">Constrained analytical actions</text>
  <text x="462" y="288" class="body mono" fill="#b9d9ce">observe · compare · attribute</text>
  <text x="462" y="317" class="body mono" fill="#b9d9ce">forecast · events · lifecycle</text>
  <rect x="462" y="350" width="436" height="44" rx="12" fill="#1c5949" stroke="#72d5b5" stroke-opacity=".25"/>
  <text x="680" y="377" text-anchor="middle" class="label white">Validate inputs · compute · return an explicit result</text>

  <path d="M930 294H990" fill="none" stroke="#239878" stroke-width="2.4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="990" y="188" width="340" height="212" rx="24" fill="#e0f6ec" stroke="#42b892" stroke-opacity=".42"/>
  </g>
  <text x="1018" y="226" class="eyebrow mono">TYPED RESULT</text>
  <text x="1018" y="264" class="section">Composable typed results</text>
  <text x="1018" y="302" class="body mono">MetricFrame · DeltaFrame</text>
  <text x="1018" y="329" class="body mono">AttributionFrame …</text>
  <rect x="1018" y="352" width="284" height="28" rx="9" fill="#ccebdd"/>
  <text x="1160" y="371" text-anchor="middle" class="tiny">Preserves approved business meaning</text>

  <path d="M220 400V468" fill="none" stroke="#cc7655" stroke-width="2.2" stroke-dasharray="7 7" marker-end="url(#escape-arrow)"/>
  <path d="M1160 400V468" fill="none" stroke="#cc7655" stroke-width="2.2" stroke-dasharray="7 7" marker-end="url(#escape-arrow)"/>
  <text x="70" y="464" class="eyebrow mono warm">TERMINAL ESCAPES</text>

  <g filter="url(#shadow)">
    <rect x="70" y="486" width="560" height="232" rx="24" fill="#fffaf5" stroke="#cc7655" stroke-opacity=".42"/>
  </g>
  <rect x="70" y="486" width="8" height="232" rx="4" fill="#cc7655"/>
  <text x="102" y="526" class="eyebrow mono warm">RAW SQL / DEFINITION GAP</text>
  <text x="102" y="565" class="section">When a definition is missing</text>
  <text x="102" y="600" class="body">Read-only · one statement · bounded result · reason required</text>
  <text x="102" y="633" class="label warm">Signal: what is missing from the semantic layer?</text>
  <rect x="102" y="660" width="496" height="34" rx="10" fill="#f7e7de"/>
  <text x="350" y="682" text-anchor="middle" class="tiny">Terminal result · no typed re-entry</text>

  <g filter="url(#shadow)">
    <rect x="770" y="486" width="560" height="232" rx="24" fill="#fffaf5" stroke="#cc7655" stroke-opacity=".42"/>
  </g>
  <rect x="770" y="486" width="8" height="232" rx="4" fill="#cc7655"/>
  <text x="802" y="526" class="eyebrow mono warm">TO_PANDAS / PYTHON ECOSYSTEM</text>
  <text x="802" y="565" class="section">From a typed result into Python</text>
  <text x="802" y="600" class="body mono">pandas · SciPy · statsmodels · scikit-learn</text>
  <text x="802" y="633" class="label warm">Signal: a semantic gap or a missing DSL action?</text>
  <rect x="802" y="660" width="496" height="34" rx="10" fill="#f7e7de"/>
  <text x="1050" y="682" text-anchor="middle" class="tiny">Terminal result · no typed re-entry</text>

  <text x="70" y="766" class="eyebrow mono">FEEDBACK</text>
  <rect x="70" y="783" width="1260" height="38" rx="13" fill="#dff4ea" stroke="#42b892" stroke-opacity=".38"/>
  <text x="700" y="808" text-anchor="middle" class="label">Recurring business meaning belongs in semantics. Recurring analytical actions belong in the DSL.</text>
</svg>
