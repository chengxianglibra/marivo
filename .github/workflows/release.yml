name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    env:
      MARIVO_TEST_S3_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Bootstrap environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev,docs]"

      - name: Start isolated Runtime storage
        run: |
          docker run --detach --name marivo-release-minio \
            --publish 127.0.0.1:9000:9000 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          curl --retry 30 --retry-all-errors --retry-delay 1 \
            --max-time 5 --fail --silent --show-error \
            "$MARIVO_TEST_S3_ENDPOINT/minio/health/ready"

      - name: Run release checks including full Runtime acceptance
        run: make release-check

      - name: Stop isolated Runtime storage
        if: always()
        run: docker rm --force marivo-release-minio

      - name: Build distributions
        run: make pypi-build

      - name: Check distributions
        run: make pypi-check

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/pypi/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/marivo
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/pypi

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi
