name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel only a pull request's superseded run. Push, release, and merge-group
# runs use a unique group so an in-progress required check is left running.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  typecheck:
    name: typecheck (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Architecture governance diff
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          guard="scripts/check_governance_diff.py"
          if git cat-file -e "$PR_BASE_SHA:$guard"; then
            git show "$PR_BASE_SHA:$guard" > "$RUNNER_TEMP/check_governance_diff.py"
            guard="$RUNNER_TEMP/check_governance_diff.py"
          fi
          python3 "$guard" --base "$PR_BASE_SHA" --head HEAD

      - uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python-version }}
          save-cache: "true"

      - name: Lint
        if: matrix.python-version == '3.12'
        run: make lint

      - name: Docs
        if: matrix.python-version == '3.12'
        run: make docs-api

      - name: Shard map
        if: matrix.python-version == '3.12'
        run: .venv/bin/python scripts/ci_shard_files.py --check

      - name: Typecheck
        run: make typecheck MYPY_PYTHON_VERSION="${{ matrix.python-version }}"

  tests:
    name: tests (${{ matrix.python-version }} shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run shard
        run: |
          mapfile -t files < <(.venv/bin/python scripts/ci_shard_files.py --shard "${{ matrix.shard }}")
          if ((${#files[@]} == 0)); then
            echo "shard ${{ matrix.shard }} selected no tests" >&2
            exit 1
          fi
          make test TESTS="${files[*]}"

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/bootstrap
        with:
          python-version: "3.12"

      - name: Install formal dependencies
        run: .venv/bin/python -m pip install -e ".[formal]"

      - name: Verify formal contracts
        run: make verify-formal

  check:
    name: check (${{ matrix.python-version }})
    needs: [typecheck, tests, formal]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Require this Python version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_require_checks.py \
            --python-version "${{ matrix.python-version }}" \
            --shards 4
