[pytest]
testpaths = tests
pythonpath = .
# Do not put `-m` here. pytest-testmon turns affected-test selection off
# whenever `-m` is set, including from addopts. Release and runtime tests are
# deselected in tests/conftest.py when the user did not pass `-m`.
# `-n auto` is the direct-pytest default (logical CPUs). `make test` passes
# PYTEST_WORKERS, which overrides this.
addopts = -n auto --dist=worksteal
# Restrict class collection to unittest.TestCase subclasses only.
# Without this, pytest tries to collect any class named Test* that appears in
# test files (including imported domain types like TestResultFinding), which
# produces PyptestCollectionWarning because TypedDicts have a non-standard __init__.
python_classes =
markers =
    runtime: integration checks requiring an already-running external datasource service
    release: release-only checks excluded from the default test suite
    slow: extended cases included in make test unless also marked release
filterwarnings =
    ignore::DeprecationWarning:ibis.*
    ignore:Field name "schema" in "ArtifactContract" shadows:UserWarning
