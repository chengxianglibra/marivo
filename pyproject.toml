[tool.ruff.lint.isort]
known-first-party = ["marivo"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"marivo.datasource.engines.duckdb".msg = "Use the datasource engine profile."
"marivo.datasource.engines.postgres".msg = "Use the datasource engine profile."
"marivo.datasource.engines.mysql".msg = "Use the datasource engine profile."
"marivo.datasource.engines.trino".msg = "Use the datasource engine profile."
"marivo.datasource.engines.clickhouse".msg = "Use the datasource engine profile."
"ibis.connect".msg = "Open declared sources with the datasource connection service."
"duckdb.connect".msg = "Open declared sources with the datasource connection service."

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
show_error_codes = true
pretty = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
# Constructors in Ibis's untyped Resolver implementation have no signatures.
# Keep nominal source/result distinctions without disabling checks on our calls.
untyped_calls_exclude = ["ibis.common.deferred"]

[[tool.mypy.overrides]]
module = ["ibis.*", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ibis.common.deferred", "ibis.common.bases"]
# Ibis does not ship py.typed. Follow its nominal Deferred class so public
# source inputs remain distinct from Columns, artifacts and bare references.
follow_untyped_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "ibis"
follow_imports = "skip"

[tool.coverage.run]
source = ["marivo"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
