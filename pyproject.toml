[project]
name = "marivo"
version = "0.6.13.dev0"
description = "Python-native semantic modeling and analysis library for agentic analytics."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "li chengxiang", email = "chengxiang.libra@gmail.com" },
]
keywords = ["semantic-layer", "analytics", "agentic-analysis", "python-library"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "ibis-framework>=12.0.0",
    "numpy>=1.26.0",
    "packaging>=21.3",
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=10.0.1",
    "pydantic>=2.9.0",
    "python-dateutil>=2.9.0",
    "sqlglot==30.8.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli_w>=1.0",
    "typing-extensions>=4.8.0",
]

[project.urls]
Homepage = "https://marivo.io"
Repository = "https://github.com/chengxianglibra/marivo"
Issues = "https://github.com/chengxianglibra/marivo/issues"

[project.scripts]
marivo = "marivo.cli:main"

[project.optional-dependencies]
api = [
    "uvicorn>=0.54,<1",
    # ONNX Runtime 1.24.3 declares Python 3.10 support but ships no cp310 wheels.
    "onnxruntime>=1.23.2,<1.24; python_version < '3.11'",
    "onnxruntime>=1.23.2,<2; python_version >= '3.11'",
    "tokenizers>=0.23.3,<1",
]
semantic-search = ["sentence-transformers>=3.0,<6.0"]
duckdb = ["ibis-framework[duckdb]>=12.0.0", "duckdb>=1.5.3,<2"]
trino = ["ibis-framework[trino]>=12.0.0"]
# PyMySQL 1.2.3 breaks uncached caching_sha2_password RSA authentication.
mysql = ["PyMySQL[rsa]>=1.1.2,<1.2", "pyarrow-hotfix>=0.4", "rich>=12.4.4"]
postgres = ["ibis-framework[postgres]>=12.0.0"]
clickhouse = ["ibis-framework[clickhouse]>=12.0.0"]
all = [
    "ibis-framework[duckdb,trino,postgres,clickhouse]>=12.0.0",
    "duckdb>=1.5.3,<2",
    "PyMySQL[rsa]>=1.1.2,<1.2",
]
docs = [
    "sphinx>=7",
    "pydata-sphinx-theme>=0.15",
]
formal = ["z3-solver==4.15.1.0"]
dev = [
    "marivo[api]",
    "jsonschema>=4.18",  # Verify HTTP payloads against the generated OpenAPI schemas.
    "ibis-framework[duckdb,trino,postgres,clickhouse]>=12.0.0",
    "duckdb>=1.5.3,<2",
    "clickhouse-connect>=1.4.0",  # Ships PEP 561 type information for datasource test helpers.
    "pytest>=8",
    "pytest-xdist>=3.2.1",
    "pytest-testmon>=2.2.0",  # Affected-test selection for make check-fast.
    "pytest-cov>=5.0",
    "PyYAML>=6.0",
    "scipy>=1.11",  # Pandas rank correlation used by analysis tests.
    "ruff==0.17.3",  # Keep in sync with .pre-commit-config.yaml.
    "mypy>=2.3",
    "tomli>=2.0",  # Type-check the Python 3.10 import branch on newer interpreters.
    "numpy>=1.26.0",
    "pandas-stubs>=2.2.0,<3.0.0",
    "types-python-dateutil>=2.9.0",
    "types-jsonschema>=4.18",
    "types-PyYAML>=6.0",
    "PyMySQL[rsa]>=1.1.2,<1.2",
    "types-PyMySQL>=1.1.0,<1.2",
    "pre-commit>=4.0",
    "import-linter>=2.11",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["marivo*"]

[tool.setuptools.package-data]
"marivo.skills" = ["**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "TCH",
    "RUF",
    "PLC0415",
    "TID251",
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "TC001",  # Keep runtime imports when annotations are also runtime values.
    "TC002",  # Keep third-party imports when modules use runtime type metadata.
    "TC003",  # Keep standard-library imports readable in implementation modules.
    "RUF001", # Ambiguous unicode character (intentional use of Greek letters like ρ)
    "RUF002", # Ambiguous unicode character in docstring (intentional)
    "RUF003", # Ambiguous unicode comment character (intentional)
]

[tool.ruff.lint.per-file-ignores]
"marivo/analysis/__init__.py" = [
    "PLC0415",
    "F401",    # re-exports not in __all__ are intentional facade imports
]
"tests/**/*.py" = [
    "S101",
    "RUF012",
    "N802",
    "F841",
    "E731",
    "B007",
    "B017",
    "RUF059",
]

