[project]
name = "marivo"
version = "0.6.0.dev0"
description = "Python-native semantic modeling and analysis library for agentic analytics."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "li chengxiang", email = "chengxiang.libra@gmail.com" },
]
keywords = ["semantic-layer", "analytics", "agentic-analysis", "python-library"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "ibis-framework>=12.0.0",
    "numpy>=1.26.0",
    "packaging>=21.3",
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=10.0.1",
    "pydantic>=2.9.0",
    "python-dateutil>=2.9.0",
    "sqlglot==30.8.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli_w>=1.0",
    "typing-extensions>=4.8.0",
]

[project.urls]
Homepage = "https://marivo.io"
Repository = "https://github.com/chengxianglibra/marivo"
Issues = "https://github.com/chengxianglibra/marivo/issues"

[project.scripts]
marivo = "marivo.cli:main"

[project.optional-dependencies]
semantic-search = ["sentence-transformers>=3.0,<6.0"]
# Keep the validated DuckDB version until Ibis supports DuckDB 2.0.
duckdb = ["ibis-framework[duckdb]>=12.0.0", "duckdb==1.5.3"]
trino = ["ibis-framework[trino]>=12.0.0"]
# PyMySQL 1.2.3 breaks uncached caching_sha2_password RSA authentication.
mysql = ["PyMySQL[rsa]>=1.1.2,<1.2", "pyarrow-hotfix>=0.4", "rich>=12.4.4"]
postgres = ["ibis-framework[postgres]>=12.0.0"]
clickhouse = ["ibis-framework[clickhouse]>=12.0.0"]
all = [
    "ibis-framework[duckdb,trino,postgres,clickhouse]>=12.0.0",
    "duckdb==1.5.3",
    "PyMySQL[rsa]>=1.1.2,<1.2",
]
docs = [
    "sphinx>=7",
    "pydata-sphinx-theme>=0.15",
]
dev = [
    "ibis-framework[duckdb,trino,postgres,clickhouse]>=12.0.0",
    "duckdb==1.5.3",
    "clickhouse-connect>=1.4.0",  # Ships PEP 561 type information for datasource test helpers.
    "pytest>=8",
    "pytest-xdist>=3.2.1",
    "pytest-cov>=5.0",
    "scipy>=1.11",  # Pandas rank correlation used by analysis tests.
    "ruff>=0.3.0",
    "mypy>=2.3",
    "numpy>=1.26.0",
    "pandas-stubs>=2.2.0,<3.0.0",
    "types-python-dateutil>=2.9.0",
    "PyMySQL[rsa]>=1.1.2,<1.2",
    "types-PyMySQL>=1.1.0,<1.2",
    "pre-commit>=4.0",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["marivo*"]

[tool.setuptools.package-data]
"marivo.skills" = ["**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "TC001",  # Keep runtime imports when annotations are also runtime values.
    "TC002",  # Keep third-party imports when modules use runtime type metadata.
    "TC003",  # Keep standard-library imports readable in implementation modules.
    "RUF001", # Ambiguous unicode character (intentional use of Greek letters like ρ)
    "RUF002", # Ambiguous unicode character in docstring (intentional)
    "RUF003", # Ambiguous unicode comment character (intentional)
]

[tool.ruff.lint.per-file-ignores]
"marivo/analysis/__init__.py" = [
    "F401",    # re-exports not in __all__ are intentional facade imports
]
"tests/**/*.py" = [
    "S101",    # allow assert in tests
    "RUF012",  # allow mutable class attributes in tests
    "N802",    # allow non-lowercase function names (test helpers)
    "F841",    # allow unused variables (test setup)
    "E731",    # allow lambda assignments (test fixtures)
    "B007",    # allow unused loop variables
    "B017",    # allow assertRaises(Exception)
    "RUF059",  # allow unused unpacked variables
]

[tool.ruff.lint.isort]
known-first-party = ["marivo"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
show_error_codes = true
pretty = true
# Constructors in Ibis's untyped Resolver implementation have no signatures.
# Keep nominal source/result distinctions without disabling checks on our calls.
untyped_calls_exclude = ["ibis.common.deferred"]

[[tool.mypy.overrides]]
module = ["ibis.*", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ibis.common.deferred", "ibis.common.bases"]
# Ibis does not ship py.typed. Follow its nominal Deferred class so public
# source inputs remain distinct from Columns, artifacts and bare references.
follow_untyped_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "ibis"
follow_imports = "skip"

[tool.coverage.run]
source = ["marivo"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
