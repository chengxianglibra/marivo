connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=qualification
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg
iceberg.jdbc-catalog.connection-user=iceberg
iceberg.jdbc-catalog.connection-password=${ENV:QUALIFICATION_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=local:///data
iceberg.jdbc-catalog.schema-version=V1
fs.local.enabled=true
local.location=/warehouse
iceberg.expire-snapshots.min-retention=0s
